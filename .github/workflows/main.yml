# This is a basic workflow to help you get started with Actions

name: msm-Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Image Build
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 8
      matrix:
        device:
          # sm8150
          - mh2lm
          - betalm
          - nabu
          - vayu-huaxing
          - vayu-tianma
          - cepheus
          - hotdog
          - guacamole
          # sdm845
          - beryllium-ebbg
          - beryllium-tianma
          - polaris
          - perseus
          # sm7325
          - mona
          - lisa
          # msm8998
          - cheeseburger

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
  
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
       
      - name: Install required packages
        run: |
          # 1. Enable 32-bit architecture needed for older build elements
          sudo dpkg --add-architecture i386
          sudo apt-get update
          
          # 2. Install all build requirements natively (swapping python3-distutils for python3-setuptools)
          sudo apt-get -y install build-essential uuid-dev clang llvm iasl nasm gcc-aarch64-linux-gnu abootimg python3-setuptools python3-pil python3-git gettext libgcc-s1:i386 libstdc++6:i386 libsdl2-dev
          
          # 3. Install Wine natively (Ubuntu 24.04 includes stable modern wine versions automatically)
          sudo apt-get -y install wine wine32 wine64

      - name: Build an image for ${{ matrix.device }}
        run: |
          ./build.sh --device ${{ matrix.device }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}
          path: ./*.img
